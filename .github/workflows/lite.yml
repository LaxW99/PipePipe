name: Build PipePipe Lite

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork and Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply 30-FPS Limit and Efficiency Patch
        run: |
          echo "" | base64 -d > patch.py
          python3 patch.py

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          cd PipePipeClient
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-Lite-APK
          path: PipePipeClient/app/build/outputs/apk/debug/*.apk
